# Firebase App Hosting config (runs the Express server: `npm run build` then `npm start`).
runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: NODE_ENV
    value: production
  # AI ideas need a Gemini key. Without it the app still works with its built-in meals.
  # To turn AI ideas on, create a Secret Manager secret named GEMINI_API_KEY, grant the
  # backend access (Firebase console > App Hosting > backend > Settings > Environment),
  # then uncomment these lines:
  # - variable: GEMINI_API_KEY
  #   secret: GEMINI_API_KEY
  #   availability:
  #     - RUNTIME
