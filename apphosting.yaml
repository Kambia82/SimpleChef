# Firebase App Hosting config (runs the Express server: `npm run build` then `npm start`).
# One-time setup:  firebase apphosting:secrets:set GEMINI_API_KEY
runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: NODE_ENV
    value: production
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - RUNTIME
